name: 📊 Publicar Dashboard Graham & Lynch

# O dashboard NAO e mais gerado aqui (StatusInvest bloqueia IPs de datacenter).
# Ele e gerado LOCALMENTE (dados StatusInvest confiaveis) por uma tarefa agendada
# no Windows que roda dashboard_completo.py e faz commit+push do HTML pronto.
# Este workflow so publica o arquivo ja commitado no GitHub Pages.

on:
  # Atualiza o Pages sempre que o HTML gerado localmente for enviado ao repo
  push:
    branches: [main]
    paths:
      - 'graham_dashboard.html'
      - '.github/workflows/update-dashboard.yml'

  # Permite disparo manual pelo GitHub, se necessario
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repositório
        uses: actions/checkout@v4

      - name: 🔎 Verificar origem dos dados do HTML
        run: |
          if grep -q "Dados via StatusInvest (local)" graham_dashboard.html; then
            echo "OK: HTML gerado localmente com dados StatusInvest."
          else
            echo "::warning::HTML nao gerado com dados StatusInvest locais - recomendacoes Graham/Lynch podem divergir da versao local. Rode atualizar_e_publicar.bat no PC pessoal."
          fi

      - name: 📁 Preparar para deploy
        run: |
          mkdir -p deploy
          cp graham_dashboard.html deploy/index.html

      - name: 🚀 Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "📊 Dashboard publicado a partir de ${{ github.sha }}"
